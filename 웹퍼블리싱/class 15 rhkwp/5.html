<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <link rel="stylesheet" href="styls.css">
     </head>
  <body>
    <div id="wrap">
        <!-- header start -->
      <header>
        <h1><a href="#">ododog</a></h1>
        <ul class="nav">
          <li><a href="#">profile</a></li>
          <li><a href="#">portfolio</a></li>
          <li><a href="#">contact</a></li>
        </ul>
      </header>
        <!-- header end -->

        <!-- main start -->
      <main>
        <h2>안녕하세요~</h2>

          <!-- video box start -->
        <div class="video-box">
          <video autoplay loop muted playsinline>
            <source src="img/trees.mp4" type="video/mp4" />
            <p>브라우저에서 비디오를 지원하지 않습니다.</p>
          </video>
        </div>
          <!-- video box end -->

          <!-- profile box start -->
        <div class="profile-box">
          <div id="card">
            <img src="img/img_profile.jpg" alt="프로필 이미지" />
            <h1>박성한</h1>
            <p>
             박성한그는누구인가인천야구의암울한유격수계보를끊은 정본인이며원클럽맨으로서초등학교때야구부의간식을배달해주다우연히야구부를시작했다그러다가... <더보기>
            </p>
            <a href="http://google.com" target="_blank">pick me!!</a>
          </div>
        </div>
          <!-- profile box end -->

          <!-- portfolio box start -->
        <div class="portfolio-box">
            <ul class="photo-list">
                <li><a href="#modal1"><img src="img/img_photo_1.jpg" alt=""></a></li>
                <li><a href="#modal2"><img src="img/img_photo_2.jpg" alt=""></a></li>
                <li><a href="#modal3"><img src="img/img_photo_3.jpg" alt=""></a></li>
            </ul>
            <div id="modal1" class="modal">
                <div class="modal-content">
                    <a href="#" class="close-btn">&times;</a>
                    <img src="img/img_photo_1.jpg" alt="">
                </div>
            </div>
            <div id="modal2" class="modal">
                <div class="modal-content">
                    <a href="#" class="close-btn">&times;</a>
                    <img src="img/img_photo_2.jpg" alt="">
                </div>
            </div>
            <div id="modal3" class="modal">
                <div class="modal-content">
                    <a href="#" class="close-btn">&times;</a>
                    <img src="img/img_photo_3.jpg" alt="">
                </div>
            </div>
        </div>
          <!-- portfolio box end -->

          <!-- slide box start -->
        <div class="slide-box">
            <ul>
                <li><img src="img/img_album.jpg" alt=""></li>
                <li><img src="img/img_album2.jpg" alt=""></li>
                <li><img src="img/img_album3.jpg" alt=""></li>
            </ul>
        </div>
          <!-- slide box end -->

      </main>
        <!-- main end -->

        <!-- footer start -->
      <footer>
        <p>&copy;ododog 2026.</p>
        <ul>
          <li><a href="#">insta</a></li>
          <li><a href="#">behance</a></li>
        </ul>
      </footer>
        <!-- footer end -->
    </div>
  </body>
</html>
