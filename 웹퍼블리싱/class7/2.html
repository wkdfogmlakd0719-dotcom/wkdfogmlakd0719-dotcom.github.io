<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child {
            background: skyblue;
        }
        
      lilast-child{
            background:pink;
        }
        li:nth-child(3) {
            background: springgreen;
        }
        li:nth-child(even) {
            color: red
        }
        li:nth-child(3n-1) {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <ul>
        <l1>1</l1>
        <l1>2</l1>

        <l1>6</l1>

    </ul>
