<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background: aquamarine;
            margin: 10px;
        }
        .box.all {
            border: 5px solid rebeccapurple;
            border-radius: 50%;
        }
        .box.top {
            border-top: 5px dotted red;
            border-radius: 30px 0 0 0;

        }
        .box.left { 
            border-left: 5px dashed darkblue;
            border-radius: 0 30px 0 0;

        }
        .box.right {
            border-right: 5px solid orangered;
            border-radius: 0 0 30px 0;

        }
        .box.bottom {
            border-bottom: 5px dashed darkmagenta;
            border-radius: 0 0 0 30px;

        }
    </style>
</head>
<body>
    <div class="box all">다</div>
    <div class="box top">위</div>
    <div class="box left">왼쪽</div>
    <div class="box right">오른쪽</div>
    <div class="box bottom">아래</div>

</body>
</html>
