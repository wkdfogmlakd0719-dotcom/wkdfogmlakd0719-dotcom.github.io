<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 100px;
            background: aqua;
            border: 3px solid navy;
        }
        .margin {
            margin: 10px 20px;
        }
        .padding {
            box-sizing: border-box;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div>기준!</div>
    <div class="margin">마진</div>
    <div class="padding">패딩</div>
</body>
</html>
