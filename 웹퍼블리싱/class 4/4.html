<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap {
            width: 100%;
            height: 400px;
            background: aqua;
        }
        div {
            width: 100px;
            height: 100px;
            background: orangered;
        }
        .fixed {
            position: fixed;
            top: 100px;
            left: 100px;
        }
        .absolute {
            position: absolute;
            top: 100px;
            right: 200px;
            background: pink;
        }
        .relative {
            position: relative;
            top: 100px;
            left: 100px;
        }
        .parent {
            position: relative;
            top: 500px;
            left: 200px;
            width: 300px;
            height: 500px;
            background: tomato;
        }
        .absolute2 {
            position: absolute;
            top: 0;
            left: 0;
            background: purple;
        }
    </style>
</head>
<body>
    <div class="wrap"></div>
    <div class="fixed">픽스</div>
   <div class="relative">상대좌표</div>
   <div class="absolute">절대좌표</div>
   <div class="parent">
        <div class="absolute2">절대좌표 2</div>

   </div>


</body>
</html>
