<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul {
            list-style: none;
        }
        #wrap {
            position: relative;
            width: 800px;
            background: rgb(255, 243, 105);
            border: 10px solid #000;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .top {
            width: 100%;
            height: 70px;
            background: #000;
            color: #fff;
        }
        .up {
            padding: 20px;
            border-bottom: 10px solid #000;
        }
        .up li {
            display: inline-block;
            width: 19.5%;
        }
        .up li img {
            width: 100%;
        }
        .bold {
            font-size: 24px;
            font-weight: bold;
            color: rgb(234, 0, 255);
        }
        .think {
            position: absolute;
            bottom: -65%;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div class="top">
            <h1>농담곰 설명서</h1>
        </div>
        <div class="container">
            <div class="up">
                <h2>좋아하는 것</h2>
                <ul>
                    <li><img src="img/img_1.png"></li>
                    <li><img src="img/img_2.png"></li>
                    <li><img src="img/img_3.png"></li>
                    <li><img src="img/img_4.png"></li>
                    <li><img src="img/img_5.png"></li>
                </ul>
            </div>
            <div class="down">
                <h2>주의 사항</h2>
                <ul>
                    <li>먹이를 함부로 주지 마시오.</li>
                    <li>야근을 시키시 마시오.</li>
                    <li class="bold">동.정.은.돈.으.로</li>
                </ul>
            </div>
        </div>
        <img src="img/img_6.jpg" alt="생각하는 곰">
    </div>
</body>
</html>
