<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid {
            list-style: none;
            display: grid;
            grid-gap: 10px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 100px);
        }
        .grid li {
            background: #e37bcd;
        }
        .grid li:nth-child(5) {
            grid-column: 1;
            grid-row: 1;
        }
        .grid li:nth-child(3) {
            grid-column: 2;
            grid-row: 1;
        }
        .grid li:nth-child(7) {
            grid-column: 3;
            grid-row: 1;
        }
        .grid li:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }
        .grid li:nth-child(1) {
            grid-column: 2;
            grid-row: 2;
        }
        .grid li:nth-child(9) {
            grid-column: 3;
            grid-row: 2;
        }
        .grid li:nth-child(8) {
            grid-column: 1;
            grid-row: 3;
        }
        .grid li:nth-child(6) {
            grid-column: 2;
            grid-row: 3;
        }
        .grid li:nth-child(4) {
            grid-column: 3;
            grid-row: 3;
        }
    </style>
</head>
<body>
    <ul class="grid">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li>8</li>
        <li>9</li>
    </ul>
</body>
</html>
