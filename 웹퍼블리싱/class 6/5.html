<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 415px;
            height: 370px;
            background: url(run.png) no-repeat;
            animation: run 1s infinite steps(10), moving 10s forwards;
        }
        @keyframes run {
            100% {
                background-position:-4150px, 0;
            }
        }
        @keyframes moving {
            100% {
                transform: translate(2000px, 1000px);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
