<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background: pink;
            margin: 20px;
            font-size: 40px;
        }
        .move {
            transform: translate(200px);
        }
        .rotate {
            transform: rotate(45deg);
        }
        .scale {
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <div class="box">기본</div>
    <div class="box move">이동</div>
    <div class="box rotate">회전</div>
    <div class="box scale">확대</div>

</body>
</html>
