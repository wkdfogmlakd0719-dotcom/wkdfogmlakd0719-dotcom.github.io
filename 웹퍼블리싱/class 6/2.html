<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 100px;
            height: 100px;
            background: red;
            border-radius: 50%;
            border: 5px solid #000;
            animation: moving 1s 1s ease 3 alternate;
            animation: moving 1s 1s ease 3 step-end;
        }
        @keyframes moving {
            0% {
                top: 100px;
                left: 100px;
                border-radius: 50%;
            }
            50% {
                top: 300px;
                left: 300px;
                border-radius: 25%;
            }
            100% {
                top: 600px;
                left: 600px;
                border-radius: 0%;
            }

        }
    </style>
</head>
<body>
    <div class="circle"></div>
</body>
</html>
